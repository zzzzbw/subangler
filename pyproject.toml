[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subangler"
version = "0.1.0"
description = "以 Subliminal 为内核的字幕自动化下载整理工具"
requires-python = ">=3.12"
dependencies = [
    "subliminal>=2.8.0,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "pymediainfo>=6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
subangler = "subangler.cli:main"
subangler-doctor = "subangler.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subangler = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
